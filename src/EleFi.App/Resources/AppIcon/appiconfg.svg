<?xml version="1.0" encoding="UTF-8"?>
<!--
    Ele, the mascot, as the icon foreground.

    Android adaptive icons crop the outer third: only the middle 66% of this canvas is
    guaranteed visible on every launcher. Ele therefore sits inside roughly 108..404 on a
    512 grid, with nothing important beyond it.

    Drawn from a handful of large shapes rather than fine detail, because the icon is read
    at 48dp far more often than at 512. Ears wide, trunk curling up, eyes high and far
    apart: those three things are what make it read as an elephant at thumbnail size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFEAF6"/>
      <stop offset="1" stop-color="#CFC6DF"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9A9D0"/>
      <stop offset="1" stop-color="#9F8CBC"/>
    </linearGradient>
  </defs>

  <!--
    The artwork below is drawn head-first, so its shapes span y 154..432 and its visual
    centre is y 293, not 256. Left alone, a circular launcher mask crops it off-centre and
    Ele ends up sitting low with his trunk clipped. This transform lifts the whole drawing
    so the visual centre lands on the canvas centre, which is what the mask crops around.
  -->
  <g transform="translate(0 -34)">
    <!-- Ears. Drawn first so the head overlaps them. -->
    <ellipse cx="150" cy="236" rx="62" ry="82" fill="url(#hide)" transform="rotate(-14 150 236)"/>
    <ellipse cx="362" cy="236" rx="62" ry="82" fill="url(#hide)" transform="rotate(14 362 236)"/>
    <ellipse cx="156" cy="240" rx="38" ry="54" fill="url(#earInner)" transform="rotate(-14 156 240)"/>
    <ellipse cx="356" cy="240" rx="38" ry="54" fill="url(#earInner)" transform="rotate(14 356 240)"/>

    <!-- Head. -->
    <ellipse cx="256" cy="240" rx="112" ry="104" fill="url(#hide)"/>

    <!-- Trunk, curling up. The curl is what stops it reading as a snout. -->
    <path d="M256 316
             C 256 372, 246 404, 276 420
             C 300 432, 322 418, 320 396"
          fill="none" stroke="url(#hide)" stroke-width="46" stroke-linecap="round"/>

    <!-- Tusks, small and low-contrast so they do not dominate at small sizes. -->
    <path d="M206 330 C 196 356, 200 372, 214 380" fill="none" stroke="#FBF9FF"
          stroke-width="15" stroke-linecap="round" opacity="0.95"/>
    <path d="M306 330 C 316 356, 312 372, 298 380" fill="none" stroke="#FBF9FF"
          stroke-width="15" stroke-linecap="round" opacity="0.95"/>

    <!-- Eyes. High and wide: the single biggest cue that this is a face. -->
    <circle cx="212" cy="220" r="16" fill="#3B3154"/>
    <circle cx="300" cy="220" r="16" fill="#3B3154"/>
    <circle cx="218" cy="214" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="306" cy="214" r="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Brow line, a hint of the friendly expression the in-app mascot animates. -->
    <path d="M186 186 C 200 176, 224 176, 238 184" fill="none" stroke="#3B3154"
          stroke-width="9" stroke-linecap="round" opacity="0.55"/>
    <path d="M274 184 C 288 176, 312 176, 326 186" fill="none" stroke="#3B3154"
          stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
