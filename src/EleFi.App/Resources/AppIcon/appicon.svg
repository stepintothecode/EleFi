<?xml version="1.0" encoding="UTF-8"?>
<!--
    The icon background layer.

    A flat field, because Android's adaptive icon masks this to whatever shape the launcher
    uses (circle, squircle, rounded square) and any detail near the edge gets cut. The
    elephant lives in appiconfg.svg, inside the safe zone.

    The gradient is subtle on purpose: at 48dp a busy background just muddies the mascot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5A96"/>
      <stop offset="1" stop-color="#4A3E6B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
</svg>
