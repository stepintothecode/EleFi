<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!--
        viewport-fit=cover is what makes env(safe-area-inset-*) report real numbers.
        Android 15 forces apps edge-to-edge, so the WebView genuinely sits under the status
        bar and the gesture pill; without the insets below, content hides behind both.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EleFi</title>
    <base href="/" />
    <!-- No UI kit. The design system is app.css plus per-component .razor.css. -->
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="EleFi.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">
        <!--
            Shown until Blazor starts. Ele, happy and bobbing, rather than a spinner: the
            first thing the app says is hello. Plain SVG because the canvas mascot needs the
            runtime that is still loading. Colours come from the same tokens Ele uses later.
        -->
        <div class="boot">
            <svg class="boot-ele" viewBox="0 0 100 100" role="img" aria-label="Ele, smiling">
                <ellipse cx="22" cy="44" rx="20" ry="26" transform="rotate(-12 22 44)" fill="var(--ele-mascot-hide-dark)" />
                <ellipse cx="24" cy="45" rx="12" ry="17" transform="rotate(-12 24 45)" fill="var(--ele-mascot-ear)" />
                <ellipse cx="78" cy="44" rx="20" ry="26" transform="rotate(12 78 44)" fill="var(--ele-mascot-hide-dark)" />
                <ellipse cx="76" cy="45" rx="12" ry="17" transform="rotate(12 76 45)" fill="var(--ele-mascot-ear)" />
                <path d="M50 58 Q55 86 64 80" fill="none" stroke="var(--ele-mascot-hide)" stroke-width="12" stroke-linecap="round" />
                <ellipse cx="50" cy="47" rx="30" ry="28" fill="var(--ele-mascot-hide)" />
                <path d="M37 61 Q33 70 38 75 M63 61 Q67 70 62 75" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
                <path d="M36.5 41 Q39.5 37 42.5 41 M57.5 41 Q60.5 37 63.5 41" fill="none" stroke="var(--ele-mascot-ink)" stroke-width="3.6" stroke-linecap="round" />
                <path d="M42 52 Q50 59 58 52" fill="none" stroke="var(--ele-mascot-ink)" stroke-width="2.6" stroke-linecap="round" />
                <ellipse cx="33" cy="51" rx="4" ry="2.4" fill="#f9a8d4" opacity="0.55" />
                <ellipse cx="67" cy="51" rx="4" ry="2.4" fill="#f9a8d4" opacity="0.55" />
            </svg>
            <p class="boot-hello" id="boot-hello">Hello!</p>
            <p class="boot-sub">Opening your ledger</p>
        </div>
    </div>
    <script>
        // A greeting for the time of day. Nothing else runs before Blazor.
        (function () {
            var h = new Date().getHours();
            var el = document.getElementById('boot-hello');
            if (el) { el.textContent = h < 5 ? 'Up late?' : h < 12 ? 'Good morning!' : h < 17 ? 'Good afternoon!' : 'Good evening!'; }
        })();
    </script>

    <div id="blazor-error-ui" data-nosnippet>
        <div class="blazor-error-text">
            <strong>Something went wrong.</strong>
            Your data is safe on this device. Reloading does not lose anything.
        </div>
        <a href="." class="reload">Reload</a>
        <span class="dismiss" role="button" aria-label="Dismiss">&#10005;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
