name: Release

# Tag-triggered, signed, sideload-ready. No Play Console (ADR-0010, ADR-0012).
#
# Setup, once:
#   keytool -genkeypair -v -keystore elefi.keystore -alias elefi \
#           -keyalg RSA -keysize 4096 -validity 10950 -storetype pkcs12
#   base64 -w0 elefi.keystore > elefi.keystore.b64      # macOS: base64 -i elefi.keystore
#
# Then add four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64     contents of elefi.keystore.b64
#   KEYSTORE_PASSWORD   the store password
#   KEY_ALIAS           elefi
#   KEY_PASSWORD        the key password
#
# Back the keystore up somewhere that is not this repository and not the build machine.
# Android refuses an update signed by a different key, so losing it means every sideloaded
# user must uninstall to move forward, which destroys their local data. There is no
# recovery path, because there is no Play Console holding a copy.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # The gates run again here rather than trusting that CI passed on the commit. A tag
      # can point anywhere, and a release is the wrong place to find out.
      - name: Test
        run: |
          dotnet test tests/EleFi.Domain.Tests -c Release
          dotnet test tests/EleFi.Application.Tests -c Release
          dotnet test tests/EleFi.Infrastructure.Tests -c Release
          dotnet test tests/EleFi.Architecture.Tests -c Release

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building EleFi $VERSION"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/elefi.keystore"

      - name: Publish signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          dotnet publish src/EleFi.App \
            -c Release \
            -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/elefi.keystore" \
            -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASSWORD" \
            -o "$RUNNER_TEMP/publish"

      - name: Name the artefact
        id: apk
        run: |
          # The signed APK is the one without -Signed in older SDKs and the only .apk in
          # newer ones. Pick the largest, which is never the unsigned intermediate.
          APK=$(find "$RUNNER_TEMP/publish" -name '*.apk' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          TARGET="$RUNNER_TEMP/EleFi-v${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      # Runs even if the build failed. A keystore left on a runner is a keystore that can
      # leak into a later job's workspace.
      - name: Shred the keystore
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/elefi.keystore" 2>/dev/null || rm -f "$RUNNER_TEMP/elefi.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## EleFi v${{ steps.version.outputs.version }}

            Sideload the APK below, or add this repository to
            [Obtainium](https://github.com/ImranR98/Obtainium) for automatic updates.

            Free, MIT licensed, and no tracking. Your data stays on your phone in an
            encrypted database.
