name: CI

# Every gate in software-development.md section 4, on every push to main and every pull
# request, as four stages that run in order: Lint, Build, Test, Publish. A stage only starts
# when the one before it passed, so a red run says at a glance which gate stopped it.
#
# Why the Android workload is installed in Lint and Build: EleFi.slnx includes EleFi.App,
# which targets net10.0-android. Restoring, formatting or building the whole solution without
# the maui-android workload fails before anything else runs, which is what every CI run did
# until 2026-10-17. Test needs no workload: no test project references the app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  lint:
    name: Lint
    # Pinned rather than ubuntu-latest, so a runner image change cannot break the build
    # without a commit here saying so.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore EleFi.slnx

      # Whitespace, code style and analyzer rules, the same check as on a developer's machine.
      # Migrations are generated by EF Core and left as it writes them.
      - name: dotnet format
        run: dotnet format EleFi.slnx --verify-no-changes --no-restore --exclude "**/Migrations/**"

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Restore fails on a high or critical advisory (NuGetAudit in Directory.Build.props,
      # warnings as errors), so a vulnerable package stops the build here.
      - name: Restore
        run: dotnet restore EleFi.slnx

      # The whole solution, the Android app included, with warnings as errors.
      - name: Build
        run: dotnet build EleFi.slnx -c Release --no-restore

      # A readable list for the log. The failing check is the restore above (NFR-5.12).
      - name: Vulnerable package report
        run: dotnet list EleFi.slnx package --vulnerable --include-transitive

  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # One project at a time rather than the solution, which would pull in the Android app.
      # Every project runs even if an earlier one fails, so one red run shows every failure.
      - name: Test
        run: |
          status=0
          for project in Domain Application Infrastructure Architecture Properties Ui; do
            echo "::group::EleFi.$project.Tests"
            dotnet test "tests/EleFi.$project.Tests" -c Release \
              --logger "trx;LogFileName=EleFi.$project.Tests.trx" \
              --results-directory "$RUNNER_TEMP/test-results" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: test
    # Only for main, never for a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Deliberately empty for now. Signed releases come from release.yml, on a version tag.
      - name: Nothing to publish yet
        run: echo "Lint, build and test passed. Publishing is not set up yet; release.yml handles signed releases on a v*.*.* tag."
