name: CI

# Every gate in software-development.md section 4, on every pull request. A gate that only
# runs sometimes is not a gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EleFi.slnx

      # The Android head needs the MAUI workload and the Android SDK, which is slow and not
      # what most changes touch. Domain, Application, Ui, Architecture and Properties all
      # target plain net10.0, so the fast gate covers everything except the shell.
      - name: Build libraries and tests
        run: |
          dotnet build src/EleFi.Domain --no-restore -c Release
          dotnet build src/EleFi.Application --no-restore -c Release
          dotnet build src/EleFi.Infrastructure --no-restore -c Release
          dotnet build src/EleFi.Ui --no-restore -c Release

      - name: Test
        run: |
          dotnet test tests/EleFi.Domain.Tests --no-restore -c Release
          dotnet test tests/EleFi.Application.Tests --no-restore -c Release
          dotnet test tests/EleFi.Infrastructure.Tests --no-restore -c Release
          dotnet test tests/EleFi.Architecture.Tests --no-restore -c Release
          dotnet test tests/EleFi.Properties.Tests --no-restore -c Release
          dotnet test tests/EleFi.Ui.Tests --no-restore -c Release

      - name: Format check
        run: dotnet format EleFi.slnx --verify-no-changes --exclude "**/Migrations/**"

      # NFR-5.12. Fails on high or critical, matching NuGetAuditLevel in
      # Directory.Build.props. Moderate advisories are fixed by pinning, not by ignoring.
      - name: Vulnerable dependency audit
        run: dotnet list EleFi.slnx package --vulnerable --include-transitive

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only on main: the Android build costs several minutes of workload restore, and it
    # cannot fail in a way the library build above would not already have caught, short of
    # a manifest or resource problem.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android
        run: dotnet build src/EleFi.App -c Release -f net10.0-android
